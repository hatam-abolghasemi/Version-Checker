name: check

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  # Release the binary runs from. Bump it after tagging a new release, so a
  # tag never reaches the schedule untested.
  VERSION_CHECKER_VERSION: v1.0.1

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Download version-checker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$VERSION_CHECKER_VERSION" --repo "$GITHUB_REPOSITORY" \
            --pattern version-checker_linux_amd64 --pattern checksums.txt
          grep ' version-checker_linux_amd64$' checksums.txt | sha256sum -c -
          mv version-checker_linux_amd64 version-checker
          chmod +x version-checker
          ./version-checker -version

      - name: Check versions
        run: ./version-checker
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # Runs even if the check step failed: state only records what was
      # delivered, so a partial send must still be saved.
      - name: Commit state
        if: ${{ !cancelled() }}
        run: |
          git add state.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update tracked versions"
            git pull --rebase
            git push
          fi
